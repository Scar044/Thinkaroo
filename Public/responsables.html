<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Responsable</title>
    <link rel="stylesheet" href="/Public/CSS/responsable.css">
</head>
<body>

    <div class="Nombre">
        <!-- Imagen de Kido -->
        <img src="../IMG/kido con mensaje.png" id="kido" alt="Kido con mensaje">

        <!-- Formulario -->
        <form class="formulario">
            <label for="input-nombre">Nombre del responsable</label>
            <input type="text" id="input-nombre" placeholder="Ingresa tu nombre" autocomplete="off">

            <label for="input-email">Correo del responsable</label>
            <input type="email" id="input-email" placeholder="correo@ejemplo.com" autocomplete="off">

            <label for="input-clave">Contraseña</label>
            <input type="password" id="input-clave" placeholder="*********">

            <label for="input-confirmar-clave">Confirmar contraseña</label>
            <input type="password" id="input-confirmar-clave" placeholder="*********">

            <button type="submit">Continuar</button>
        </form>
    </div>

</body>
</html>
