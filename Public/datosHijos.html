<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos del niño</title>

    <link rel="stylesheet" href="CSS/datosHijos.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <img src="IMG/letter_thinkaroo.png" alt="Thinkaroo" id="Logo">
    </header>

    <div class="container-fluid pagina">

        <div class="row justify-content-center">

            <div class="col-12">

                <div class="nombre">

                    <img src="IMG/kido con mensaje.png"
                         id="kido"
                         alt="Kido">

                    <form class="formulario" id="form-responsable">

                        <label for="input-nombre-nino">
                            Nombre del niño
                        </label>

                        <input
                            type="text"
                            id="input-nombre-nino"
                            autocomplete="off">

                        <label for="edad">
                            Edad del niño
                        </label>

                        <input
                            type="number"
                            id="edad">

                        <button type="submit">
                            Continuar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="JS/datosHijos.js"></script>

</body>
</html>
