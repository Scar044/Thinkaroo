<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>¿Cuántos hay?</title>

    <link rel="stylesheet" href="sumar_objetos.css">
</head>

<body>

    <header class="encabezado">

        <div class="titulo">
            ¿CUÁNTOS HAY?
        </div>

        <p class="subtitulo">
            Cuenta los elementos y selecciona el número correcto
        </p>

        <div class="marcador">
            <span id="score-text">0</span>
        </div>

    </header>


    <main class="juego">

        <section class="tarjeta">

            <div id="items-container" class="objetos">
            </div>

        </section>


        <div class="zona-mensaje">

            <div id="feedback-badge" class="mensaje oculto">
            </div>

        </div>


        <section class="panel">

            <div id="options-container" class="opciones">
            </div>

        </section>


        <div class="reinicio">

            <button onclick="resetGame()">
          ↻ Intentar de nuevo
            </button>

        </div>

    </main>


    <div id="victory-modal" class="modal oculto">

        <div class="final">

            <div class="emojis">
                
            </div>

            <h3>¡LO LOGRASTE!</h3>

            <p>
                Completaste todas las rondas de conteo.
            </p>

            <button onclick="resetGame()">
                ¡INTENTAR DE NUEVO!            </button>

        </div>

    </div>


    <script src="sumarobjetos.js"></script>

</body>

</html>
