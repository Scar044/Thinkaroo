<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego de Colores Auditivo</title>

    <link rel="stylesheet" href="CSS/colores_auditivo.css">
</head>

<body>

    <div class="juego">

        <h1>🔊 Encuentra el Color</h1>

        <p>
            Escucha el nombre del color y selecciona el color correcto.
        </p>

        <div class="datos">

            <span>
                ⭐ Puntos:
                <b id="puntos">0</b>
            </span>

            <span>
                🎯 Ronda:
                <b id="ronda">1</b> / 5
            </span>

        </div>


        <div class="escuchar">

            <div id="iconoSonido">
                🔊
            </div>

            <h2 id="instruccion">
                Escucha con atención
            </h2>

            <button id="botonEscuchar" type="button">
                🔊 Escuchar color
            </button>

        </div>


        <div id="opciones" class="opciones">

        </div>


        <div id="mensaje" class="mensaje">

        </div>


        <button id="siguiente" type="button">
            Siguiente ➜
        </button>

    </div>


    <script src="JS/colores_auditivo.js"></script>

</body>

</html>
