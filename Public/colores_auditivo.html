<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Juego de Colores Auditivo</title>

    <link rel="stylesheet" href="CSS/colores_auditivo.css">

</head>

<body>

    <div class="juego">

        <h1>🔊 Encuentra el Color</h1>

        <p class="descripcion">
            Escucha el nombre del color y selecciona el círculo correcto.
        </p>


        <div class="datos">

            <span>
                ⭐ Puntos:
                <b id="puntos">0</b>
            </span>

            <span>
                🎯 Ronda:
                <b id="ronda">1</b> / 5
            </span>

        </div>


        <!-- AUDIO -->

        <div class="instruccion">

            <div class="icono-sonido">
                🔊
            </div>

            <h2 id="instruccion">
                Escucha el color
            </h2>

            <button
                id="botonEscuchar"
                type="button">

                🔊 Escuchar color

            </button>

        </div>


        <!-- COLORES -->

        <div
            id="opciones"
            class="opciones">

            <button
                class="color rojo"
                data-color="rojo"
                type="button"
                aria-label="Rojo">
            </button>


            <button
                class="color azul"
                data-color="azul"
                type="button"
                aria-label="Azul">
            </button>


            <button
                class="color amarillo"
                data-color="amarillo"
                type="button"
                aria-label="Amarillo">
            </button>


            <button
                class="color verde"
                data-color="verde"
                type="button"
                aria-label="Verde">
            </button>


            <button
                class="color morado"
                data-color="morado"
                type="button"
                aria-label="Morado">
            </button>

        </div>


        <!-- MENSAJE -->

        <div
            id="mensaje"
            class="mensaje">
        </div>


        <!-- SIGUIENTE -->

        <button
            id="siguiente"
            type="button">

            Siguiente ➜

        </button>


        <!-- REINICIAR -->

        <button
            id="reiniciar"
            type="button">

            🔄

        </button>

    </div>


    <script src="JS/colores_audtivo.js"></script>

</body>

</html>
