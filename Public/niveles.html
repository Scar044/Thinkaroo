<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="CSS/niveles auditivo.css">
</head>
<body>
    
<header class="encabezado">
        <div class="row align-items-center w-100">
            <div class="col-3 col-lg-2">
                <img src="IMG/logo_thinkaroo-removebg-preview.png" alt="Logo" class="logo">
            </div>
           
    </header>



<section class="unidad">

    <div class="texto">

    

        <h1>
            ThinkaRoo
        </h1>

    </div>

    <button>
        <i class="fa-solid fa-list"></i>
    </button>

</section>


<!-- Camino -->

<main class="camino">

    <!-- Cofre -->

    <div class="cofre">
        <i class="fa-solid fa-box-open"></i>
    </div>


    <!-- Nivel -->

    <div class="nivel izquierda">
        <i class="fa-solid fa-headphones"></i>
    </div>


    <!-- Nivel -->

    <div class="nivel derecha continuar">

        <i class="fa-solid fa-dumbbell"></i>

        <div class="continuar-btn">
            CONTINUAR
        </div>

    </div>


    <!-- Nivel -->

    <div class="nivel izquierda">
        <i class="fa-solid fa-book"></i>
    </div>

    <div class="nivel derecha">
        <i class="fa-solid fa-star"></i>
    </div>

    <div class="nivel izquierda">
        <i class="fa-solid fa-gamepad"></i>
    </div>

    <div class="nivel derecha">
        <i class="fa-solid fa-shield"></i>
    </div>

    <div class="nivel izquierda">
        <i class="fa-solid fa-graduation-cap"></i>
    </div>

    <div class="nivel derecha">
        <i class="fa-solid fa-bolt"></i>
    </div>

    <div class="nivel izquierda">
        <i class="fa-solid fa-heart"></i>
    </div>

    <div class="nivel derecha">
        <i class="fa-solid fa-pencil"></i>
    </div>

    <div class="nivel izquierda">
        <i class="fa-solid fa-language"></i>
    </div>

    <div class="nivel derecha">
        <i class="fa-solid fa-earth-americas"></i>
    </div>

    <div class="nivel izquierda">
        <i class="fa-solid fa-microphone"></i>
    </div>

    <div class="nivel derecha">
        <i class="fa-solid fa-medal"></i>
    </div>

</main>



<script src="script.js"></script>

</body>
</html>
