<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title data-i18n="profileParent.pageTitle">
        Perfil de usuario - ThinkaRoo
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="CSS/perfill_padres.css"
    >
</head>

<body>
    <div class="contenedor">
        <header>
            <a
                href="#"
                class="flecha"
                id="volverNiveles"
                aria-label="Volver a los niveles"
            >
                🡠
            </a>

            <h1>ThinkaRoo</h1>
        </header>

        <h2 data-i18n="profileParent.title">
            Perfil de usuario
        </h2>

        <div class="tarjeta">

            <i class="estrella estrella1">★</i>
            <i class="estrella estrella2">★</i>

            <h3 id="nombreUsuario">
                Cargando...
            </h3>

            <p
                class="correo-usuario"
                id="correoUsuario"
            >
                Cargando...
            </p>

            <div class="estadisticas">

                <h4 data-i18n="profileParent.statistics">
                    📊 Estadísticas
                </h4>

                <div class="info">

                    <span data-i18n="profileParent.children">
                        👶 Hijos registrados
                    </span>

                    <span id="hijos">0</span>

                </div>

            </div>

            <button
                type="button"
                class="boton-cerrar"
                id="botonCerrar"
                data-i18n="profileParent.logout"
            >
                Cerrar sesión
            </button>
        </div>
    </div>

    <script src="JS/idioma-global.js"></script>
    <script src="JS/perfil_padre.js"></script>

</body>
</html>
