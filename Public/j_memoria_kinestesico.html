<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reto Kinestésico</title>

    <link rel="stylesheet" href="CSS/memoria_kinestesico.css">

</head>

<body>

    <div class="container">

        <h1>
            🐾 ¡Encuentra a su compañero!
        </h1>

        <p class="instrucciones">
            Toca y arrastra cada animal hasta su pareja.
        </p>

        <section class="zona">

            <h2>🐾 Arrastra los animales</h2>

            <div id="animales" class="contenedor-animales">

            </div>

        </section>


        <section class="zona destinos">

            <h2>🎯 Encuentra su lugar</h2>

            <div id="destinos" class="contenedor-destinos">

            </div>

        </section>

        <div id="mensaje" class="mensaje">

        </div>

        <button id="volver" class="boton-volver">
            Volver a niveles
        </button>

    </div>


    <script src="JS/memoria_kinestesico.js"></script>

</body>

</html>
