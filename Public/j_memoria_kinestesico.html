<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title data-i18n="kinestheticMemory.pageTitle">
        Reto Kinestésico
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="CSS/memoria_kinestesico.css"
    >

</head>

<body>

    <div class="container">

        <div class="row align-items-center">

            <div class="col-12 col-md-3 text-center mb-3 mb-md-0">

                <img
                    src="IMG/canguro6.png"
                    data-img-es="IMG/canguro6.png"
                    data-img-en="IMG/kidoo_concetrado.png"
                    data-i18n-alt="visualMemory.cangarooAlt"
                    alt="Canguro"
                    class="img-fluid canguro"
                >

            </div>
            <div class="col-12 col-md-9">

                <div class="text-center py-4">

                    <h1 data-i18n="kinestheticMemory.title">
                        🐾 ¡Encuentra a su compañero!
                    </h1>

                    <p
                        class="instrucciones"
                        data-i18n="kinestheticMemory.instructions"
                    >
                        Toca y arrastra cada animal hasta su pareja.
                    </p>
                    <section class="zona">

                        <h2 data-i18n="kinestheticMemory.dragAnimals">
                            🐾 Arrastra los animales
                        </h2>

                        <div
                            id="animales"
                            class="contenedor-animales"
                        >
                        </div>

                    </section>
                    <section class="zona destinos">

                        <h2 data-i18n="kinestheticMemory.findPlace">
                            🎯 Encuentra su lugar
                        </h2>

                        <div
                            id="destinos"
                            class="contenedor-destinos"
                        >
                        </div>

                    </section>
                    <div
                        id="mensaje"
                        class="mensaje"
                    >
                    </div>


                    <!-- VOLVER -->
                    <button
                        id="volver"
                        class="boton-volver"
                        data-i18n="kinestheticMemory.backToLevels"
                    >
                        Volver a niveles
                    </button>

                </div>

            </div>

        </div>

    </div>
    <div
        class="finish"
        id="finish"
    >

        <div class="finish-card">

            <div class="trophy">
                🏆
            </div>

            <h2 data-i18n="kinestheticMemory.finishTitle">
                ¡Excelente, ahora tu misión!
            </h2>

            <p>

                <span data-i18n="kinestheticMemory.finishDescription">
                    Busca 2 animales en tu hogar e imita sus sonidos
                </span>

                <br>

                <span data-i18n="kinestheticMemory.finishLearned">
                    ¡Aprendiste los animales!
                </span>

            </p>

            <button
                id="botonFinal"
                data-i18n="kinestheticMemory.continue"
            >
                Continuar
            </button>

        </div>

    </div>


    <script src="JS/idioma-global.js"></script>

    <script src="JS/memoria_kinestesico.js"></script>

</body>

</html>
