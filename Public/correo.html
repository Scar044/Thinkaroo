<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Thinkaroo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/correo.css">
</head>
<body>
    <header class="encabezado">
        <div class="logo-contenedor">
            <div class="titulo">
                <img src="IMG/letter_thinkaroo.png" alt="Thinkaroo" id="Logo" width="40" height="40">
                <p>¡Aprendamos juntos!</p>
            </div>
        </div>
    </header>

    <div class="background">

        <div class="container d-flex justify-content-center align-items-center py-4">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 text-center">
                <div class="correos">
                    <img src="IMG/k_i_s.Thinkaroo-removebg-preview.png" id="kido" alt="Mascota Thinkaroo">
                    <form class="formulario" id="form-registro">
                        <label for="input-nombre">Nombre</label>
                        <input type="text" id="input-nombre" placeholder="Nombre del padre/tutor" autocomplete="off">
                        
                        <label for="input-correo">Correo</label>
                        <input type="email" id="input-correo" placeholder="correo@ejemplo.com" autocomplete="off">
                        
                        <label for="input-clave">Contraseña</label>
                        <input type="password" id="input-clave" placeholder="*********">
                        
                        <label for="input-confirmar-clave">Confirmar contraseña</label>
                        <input type="password" id="input-confirmar-clave" placeholder="*********">
                        
                        <button id="registrar" type="submit">Registrarse</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="JS/correo.js"></script>
</body>
</html>
