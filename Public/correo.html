<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro - Thinkaroo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="CSS/correo.css">
</head>

<body>
    <header class="encabezado">
        <div class="logo-contenedor">
            <div class="titulo">

                <img
                    src="IMG/letter_thinkaroo.png"
                    alt="Thinkaroo"
                    id="Logo"
                    width="40"
                    height="40"
                >

                <p data-i18n="register.subtitle">
                    ¡Aprendamos juntos!
                </p>

            </div>
        </div>
    </header>

    <div class="background">

        <div class="container d-flex justify-content-center align-items-center py-4">

            <div class="col-12 col-sm-10 col-md-8 col-lg-5 text-center">

                <div class="correos">

                    <img
                        src="IMG/k_i_s.Thinkaroo-removebg-preview.png"
                        data-img-es="IMG/k_i_s.Thinkaroo-removebg-preview.png"
                        data-img-en="IMG/k_i_s.Thinkaroo-removebg-preview.png"
                        data-i18n-alt="visualMemory.cangarooAlt"
                        alt="Canguro"
                        class="img-fluid canguro"
                        id="kido"
                        alt="Mascota Thinkaroo"
                    >

                    <form class="formulario" id="form-registro">

                        <label
                            for="input-nombre"
                            data-i18n="register.name"
                        >
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="input-nombre"
                            data-i18n-placeholder="register.namePlaceholder"
                            placeholder="Nombre del padre/tutor"
                            autocomplete="off"
                            required
                        >

                        <label
                            for="input-correo"
                            data-i18n="register.email"
                        >
                            Correo
                        </label>

                        <input
                            type="email"
                            id="input-correo"
                            data-i18n-placeholder="register.emailPlaceholder"
                            placeholder="correo@ejemplo.com"
                            autocomplete="off"
                            required
                        >

                        <label
                            for="input-clave"
                            data-i18n="register.password"
                        >
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="input-clave"
                            placeholder="********"
                            required
                        >

                        <label
                            for="input-confirmar-clave"
                            data-i18n="register.confirmPassword"
                        >
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="input-confirmar-clave"
                            placeholder="********"
                            required
                        >

                        <button
                            id="registrar"
                            type="submit"
                            data-i18n="register.button"
                        >
                            Registrarse
                        </button>

                        <br>

                        <a href="InicioThinkaro.html">

                            <small>

                                <span data-i18n="register.alreadyAccount">
                                    ¿Ya tienes una cuenta?
                                </span>

                                <br>

                                <span data-i18n="register.login">
                                    Inicia sesión
                                </span>

                            </small>

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <script src="JS/idioma-global.js"></script>
    <script src="JS/correo.js"></script>
</body>
</html>
