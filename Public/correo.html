<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>correo electronico</title>
    <link rel="stylesheet" href="CSS/correo.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <img src="IMG/letter_thinkaroo.png" alt="Thinkaroo" id="Logo">
    </header>
    <div class="background">

    <img src="IMG/mancha azul.png" class="mancha-azul">

    <img src="IMG/mancha naranja.png" class="mancha-naranja">

       <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="col-12 col-sm-10 col-md-8 col-lg-5 text-center">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="col-12 col-sm-10 col-md-8 col-lg-12">

        <div class="correos">

            <img src="IMG/k_i_s.Thinkaroo-removebg-preview.png"
                 id="kido"
                 alt="Thinkaroo">

            <form class="formulario" id="form-registro">

                <label for="input-nombre">Nombre del responsable</label>
                <input type="text" id="input-nombre" autocomplete="off">

                <label for="input-correo">Correo</label>
                <input type="email" id="input-correo" autocomplete="off">

                <label for="input-clave">Contraseña</label>
                <input type="password" id="input-clave" placeholder="*********">

                <label for="input-confirmar-clave">Confirmar contraseña</label>
                <input type="password" id="input-confirmar-clave" placeholder="*********">

                <button id="registrar" type="submit">
                    Registrarse
                </button>

            </form>

        </div>

    </div>

</div>
    </div>
    </div>
    </div>
    <script src="JS/correo.js"></script>
</body>
</html>
