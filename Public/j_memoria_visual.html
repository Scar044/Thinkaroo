<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="visualMemory.pageTitle">Visual</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="CSS/memoria_visual.css"
    >

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

    <div id="canguroFijo">

        <img
            src="IMG/canguro6.png"
            data-i18n-alt="visualMemory.cangarooAlt"
            alt="Canguro"
        >

    </div>


    <div class="container text-center py-4">

        <h1 data-i18n="visualMemory.title">
            Mundo Animal: Reto de Memoria
        </h1>

        <p data-i18n="visualMemory.description">
            Selecciona las parejas de animales.
        </p>

        <div
            class="game-board mx-auto"
            id="gameBoard"
        ></div>

    </div>


    <div class="finish" id="finish">

        <div class="finish-card">

            <div class="trophy">
                🏆
            </div>

            <h2 data-i18n="visualMemory.finishTitle">
                ¡Excelente, ahora tu misión!
            </h2>

            <p>

                <span data-i18n="visualMemory.finishDescription">
                    Busca 2 animales en tu hogar e imita sus sonidos
                </span>

                <br>

                <span data-i18n="visualMemory.finishLearned">
                    ¡Aprendiste los animales!
                </span>

            </p>

            <button id="botonFinal" data-i18n="visualMemory.continue">
                Continuar
            </button>

        </div>

    </div>


    <script src="JS/idioma-global.js"></script>
    <script src="JS/memoria_visual.js"></script>

</body>

</html>
