<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="countAuditory.pageTitle">
        Escucha y cuenta
    </title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="CSS/sumarobjetos_auditivo.css"
    >

</head>

<body>
    <header class="encabezado">
        <div
            class="titulo"
            data-i18n="countAuditory.title"
        >
            🎧 ¡ESCUCHA Y CUENTA!
        </div>

        <p
            class="subtitulo"
            data-i18n="countAuditory.subtitle"
        >
            Escucha los sonidos y selecciona cuántos escuchaste
        </p>

        <div class="marcador">
            <span id="score-text">0</span>
        </div>
    </header>

    <main class="juego">
        <section class="tarjeta">

            <div class="instruccion">

                <div class="oreja">👂</div>

                <h2 data-i18n="countAuditory.question">
                    ¿Cuántos sonidos escuchaste?
                </h2>

                <button
                    id="play-button"
                    onclick="reproducirSonidos()"
                    data-i18n="countAuditory.listen"
                >
                    🔊 ESCUCHAR
                </button>

                <div
                    id="ondas"
                    class="ondas oculto"
                >
                    🔊 👂 🔊
                </div>
            </div>
        </section>

        <div class="zona-mensaje">
            <div
                id="feedback-badge"
                class="mensaje oculto"
            >
            </div>
        </div>

        <section class="panel">
            <div
                id="options-container"
                class="opciones"
            >
            </div>
        </section>

        <div class="contenedor-reinicio">

            <button
                type="button"
                class="reinicio"
                onclick="resetGame()"
                data-i18n="countAuditory.tryAgain"
            >
                🔄 Intentar de nuevo
            </button>

        </div>

    </main>

    <div
        class="finish"
        id="finish"
    >

        <div class="finish-card">

            <div class="trophy">
                🏆
            </div>

            <h2 id="mensaje-final-titulo">
                ¡Excelente ahora tu misión!
            </h2>

            <p id="mensaje-final-texto">
                Cuenta cuantos juguetes tienes
                <br>
                ¡Aprendiste a contar!
            </p>

            <button
                type="button"
                id="botonFinal"
                data-i18n="countAuditory.continue"
            >
                Continuar
            </button>

        </div>

    </div>

    <script src="JS/idioma-global.js"></script>
    <script src="JS/sumarobjetos_auditivo.js"></script>

</body>
</html>
