<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title data-i18n="putObjects.pageTitle">
    ¡Mete los objetos!
</title>

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="CSS/sumarobjetos_kinestesico.css"
>

</head>

<body>

<header class="encabezado">

    <div
        class="titulo"
        data-i18n="putObjects.title"
    >
        ¡METE LOS OBJETOS!
    </div>

    <div class="marcador">

        <span id="score-text">
            0
        </span>

    </div>

</header>
<div class="container">

    <div class="row align-items-center">

        <div class="col-12 col-md-3 text-center mb-3 mb-md-0">

            <img
                src="IMG/canguro9.png"
                data-i18n-alt="visualMemory.cangarooAlt"
                alt="Canguro"
                class="img-fluid canguro"
            >

        </div>

        <div class="col-12 col-md-9">

            <main class="juego">

                <section class="zona-juego">

                    <div
                        class="instruccion"
                        data-i18n="putObjects.instruction"
                    >
                        ✋ Arrastra cada objeto
                        <br>
                        📦 ¡Mételo dentro de la caja!
                    </div>


                    <div
                        id="objetos-container"
                        class="objetos"
                    >
                    </div>


                    <div
                        id="caja"
                        class="caja"
                    >

                        <div class="caja-tapa">
                            📦
                        </div>

                        <div class="caja-contenido">

                            <span id="contador-caja">
                                0
                            </span>

                            <span
                                class="texto-caja"
                                data-i18n="putObjects.objects"
                            >
                                objetos
                            </span>

                        </div>

                    </div>

                </section>


                <div class="zona-mensaje">

                    <div
                        id="feedback-badge"
                        class="mensaje oculto"
                    >
                    </div>

                </div>


                <section
                    id="panel-opciones"
                    class="panel oculto"
                >

                    <div
                        class="pregunta"
                        data-i18n="putObjects.question"
                    >
                        ¿CUÁNTOS OBJETOS METISTE?
                    </div>


                    <div
                        id="options-container"
                        class="opciones"
                    >
                    </div>

                </section>


                <div class="contenedor-reinicio">

                    <button
                        type="button"
                        class="reinicio"
                        onclick="resetGame()"
                        data-i18n="putObjects.tryAgain"
                    >
                        🔄 Intentar de nuevo
                    </button>

                </div>

            </main>

        </div>

    </div>

</div>
<div
    id="finish"
    class="finish"
>

    <div class="finish-card">

        <div class="trophy">
            🏆
        </div>


        <h2
            id="mensaje-final-titulo"
            data-i18n="putObjects.finishTitle"
        >
            ¡Excelente ahora tu misión!
        </h2>


        <p id="mensaje-final-texto">

            <span data-i18n="putObjects.finishLine1">
                Cuenta cuantos juguetes tienes
            </span>

            <br>

            <span data-i18n="putObjects.finishLine2">
                ¡Aprendiste a contar!
            </span>

        </p>


        <button
            type="button"
            id="botonFinal"
            data-i18n="putObjects.continue"
        >
            Continuar
        </button>

    </div>

</div>


<script src="JS/idioma-global.js"></script>
<script src="JS/sumarobjetos_kinestesico.js"></script>

</body>
</html>
